name: PromptHub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS checks (${{ matrix.runner }})
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependency-free package
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Run static checks
        run: npm run check

  test:
    if: always()
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful macOS verification
        if: needs.macos.result != 'success'
        run: |
          echo "macOS verification did not succeed; blocking the required test check." >&2
          exit 1
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependency-free package
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Run static checks
        run: npm run check
      - name: Check pull request patch whitespace
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git -c core.whitespace=cr-at-eol diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
      - name: Check pushed patch whitespace
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: git -c core.whitespace=cr-at-eol diff --check "$PUSH_BEFORE_SHA...$PUSH_HEAD_SHA"
