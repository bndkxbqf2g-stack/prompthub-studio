name: PromptHub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependency-free package
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Run static checks
        run: npm run check
      - name: Check pull request patch whitespace
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
      - name: Check pushed patch whitespace
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$PUSH_BEFORE_SHA...$PUSH_HEAD_SHA"
